<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Sign Up - Brownielicious</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="Brownies.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#FAF3E0",
              cocoa: "#5A3E36",
              caramel: "#C97B4C",
              dark: "#2E1E1A",
              rose: "#E9B7B9",
            },
            fontFamily: {
              heading: ["Playfair Display", "serif"],
              body: ["Nunito", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-cream min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-cream shadow-md">
      <nav
        class="container mx-auto px-4 py-4 flex items-center justify-between"
      >
        <a href="index.html" class="text-3xl font-bold text-cocoa"
          >Brownielicious</a
        >
        <div class="hidden md:flex items-center space-x-8">
          <a
            href="index.html"
            class="text-cocoa hover:text-caramel transition font-semibold"
            >Home</a
          >
          <a
            href="recipes.html"
            class="text-cocoa hover:text-caramel transition font-semibold"
            >Recipes</a
          >
          <a
            href="about.html"
            class="text-cocoa hover:text-caramel transition font-semibold"
            >About</a
          >
          <a
            href="contact.html"
            class="text-cocoa hover:text-caramel transition font-semibold"
            >Contact</a
          >
        </div>
        <a
          href="auth.html"
          class="hidden md:inline-block bg-caramel hover:bg-cocoa text-white px-6 py-2 rounded-full font-semibold transition duration-300"
        >
          Login
        </a>
        <button id="mobile-menu-btn" class="md:hidden text-cocoa">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden bg-cream py-4 px-4">
        <a href="index.html" class="block py-2 text-cocoa hover:text-caramel"
          >Home</a
        >
        <a href="recipes.html" class="block py-2 text-cocoa hover:text-caramel"
          >Recipes</a
        >
        <a href="about.html" class="block py-2 text-cocoa hover:text-caramel"
          >About</a
        >
        <a href="contact.html" class="block py-2 text-cocoa hover:text-caramel"
          >Contact</a
        >
        <a
          href="auth.html"
          class="block py-2 text-cocoa hover:text-caramel font-semibold"
          >Login</a
        >
      </div>
    </header>

    <!-- Auth Section -->
    <section class="auth-container py-8 px-4">
      <div
        class="auth-card w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden"
      >
        <!-- Logo and Title -->
        <div class="text-center py-8 bg-cocoa">
          <a href="index.html" class="text-3xl font-bold text-white"
            >Brownielicious</a
          >
          <p class="text-cream mt-2">Simple. Decadent. Brownies.</p>
        </div>

        <!-- Tabs -->
        <div class="flex auth-tabs bg-cream">
          <button
            id="login-tab"
            class="auth-tab flex-1 py-4 text-center font-semibold text-lg active"
            onclick="switchTab('login')"
          >
            Login
          </button>
          <button
            id="signup-tab"
            class="auth-tab flex-1 py-4 text-center font-semibold text-lg inactive"
            onclick="switchTab('signup')"
          >
            Sign Up
          </button>
          <div id="auth-slider" class="auth-slider" style="width: 50%"></div>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="auth-form active p-8">
          <form id="loginForm" class="space-y-6">
            <!-- Alert container -->
            <div id="login-alert" class="hidden"></div>

            <div>
              <label
                for="login-email"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Email Address</label
              >
              <input
                type="email"
                id="login-email"
                name="email"
                required
                class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream"
                placeholder="your@email.com"
              />
            </div>

            <div>
              <label
                for="login-password"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  required
                  class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream pr-12"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  onclick="togglePassword('login-password')"
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-cocoa"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between">
              <label class="flex items-center">
                <input
                  type="checkbox"
                  id="remember-me"
                  class="w-4 h-4 text-caramel border-2 border-cocoa rounded focus:ring-caramel"
                />
                <span class="ml-2 text-sm text-gray-600">Remember me</span>
              </label>
              <a
                href="#"
                class="text-sm text-caramel hover:text-cocoa font-semibold"
                >Forgot password?</a
              >
            </div>

            <button
              type="submit"
              id="login-btn"
              class="w-full bg-caramel hover:bg-cocoa text-white py-4 rounded-lg font-semibold text-lg transition duration-300 flex items-center justify-center"
            >
              <span>Login</span>
              <div id="login-spinner" class="spinner ml-2 hidden"></div>
            </button>
          </form>

          <div class="mt-6">
            <div class="relative">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500"
                  >Or continue with</span
                >
              </div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-4">
              <button
                type="button"
                class="social-btn w-full flex items-center justify-center px-4 py-3 border-2 border-cocoa rounded-lg hover:bg-cream"
              >
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
                <span class="text-cocoa font-semibold">Google</span>
              </button>
              <button
                type="button"
                class="social-btn w-full flex items-center justify-center px-4 py-3 border-2 border-cocoa rounded-lg hover:bg-cream"
              >
                <svg
                  class="w-5 h-5 mr-2"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"
                  />
                </svg>
                <span class="text-cocoa font-semibold">Facebook</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="auth-form p-8">
          <form id="signupForm" class="space-y-6">
            <!-- Alert container -->
            <div id="signup-alert" class="hidden"></div>

            <div>
              <label
                for="signup-name"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Full Name</label
              >
              <input
                type="text"
                id="signup-name"
                name="name"
                required
                class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream"
                placeholder="John Doe"
              />
            </div>

            <div>
              <label
                for="signup-email"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Email Address</label
              >
              <input
                type="email"
                id="signup-email"
                name="email"
                required
                class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream"
                placeholder="your@email.com"
              />
            </div>

            <div>
              <label
                for="signup-password"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="signup-password"
                  name="password"
                  required
                  minlength="8"
                  class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream pr-12"
                  placeholder="••••••••"
                  oninput="checkPasswordStrength(this.value)"
                />
                <button
                  type="button"
                  onclick="togglePassword('signup-password')"
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-cocoa"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    ></path>
                  </svg>
                </button>
              </div>
              <!-- Password strength indicator -->
              <div class="mt-2">
                <div class="password-strength bg-gray-200 rounded"></div>
                <p id="password-hint" class="text-xs text-gray-500 mt-1">
                  Use 8+ characters with letters and numbers
                </p>
              </div>
            </div>

            <div>
              <label
                for="signup-confirm"
                class="block text-sm font-semibold text-cocoa mb-2"
                >Confirm Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="signup-confirm"
                  name="confirm_password"
                  required
                  class="w-full px-4 py-3 rounded-lg border-2 border-cocoa focus:outline-none focus:border-caramel bg-cream pr-12"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  onclick="togglePassword('signup-confirm')"
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-cocoa"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>

            <div>
              <label class="flex items-start">
                <input
                  type="checkbox"
                  id="agree-terms"
                  required
                  class="w-4 h-4 mt-1 text-caramel border-2 border-cocoa rounded focus:ring-caramel"
                />
                <span class="ml-2 text-sm text-gray-600">
                  I agree to the
                  <a
                    href="#"
                    class="text-caramel hover:text-cocoa font-semibold"
                    >Terms of Service</a
                  >
                  and
                  <a
                    href="#"
                    class="text-caramel hover:text-cocoa font-semibold"
                    >Privacy Policy</a
                  >
                </span>
              </label>
            </div>

            <button
              type="submit"
              id="signup-btn"
              class="w-full bg-caramel hover:bg-cocoa text-white py-4 rounded-lg font-semibold text-lg transition duration-300 flex items-center justify-center"
            >
              <span>Create Account</span>
              <div id="signup-spinner" class="spinner ml-2 hidden"></div>
            </button>
          </form>
        </div>

        <!-- Toggle Text -->
        <div class="text-center py-6 bg-cream">
          <p id="toggle-text" class="text-gray-600">
            Don't have an account?
            <a
              href="#"
              onclick="switchTab('signup'); return false;"
              class="text-caramel hover:text-cocoa font-semibold"
              >Sign Up</a
            >
          </p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-8">
      <div class="container mx-auto px-4 text-center">
        <p class="text-gray-400">
          &copy; 2024 Brownielicious. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
